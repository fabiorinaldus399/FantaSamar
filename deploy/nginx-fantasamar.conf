server {
	listen 8080;
	server_name fantasamar.ddns.net;

	# Sfida ACME HTTP-01 per Certbot (validazione/rinnovo certificato)
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	# Redirect tutto il resto verso HTTPS (porta 4443, non standard)
	location / {
		return 301 https://$host:4443$request_uri;
	}
}

server {
	listen 4443 ssl;
	server_name fantasamar.ddns.net;

	ssl_certificate     /etc/letsencrypt/live/fantasamar.ddns.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/fantasamar.ddns.net/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /opt/fantasamar/FantaSamar/dist/FantaSamar/browser;
	index index.html;

	# Frontend Angular (SPA fallback)
	# index.html non va mai cachato dal browser: contiene i riferimenti agli
	# asset con hash, che invece possono essere cachati a lungo.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		try_files $uri /index.html;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Asset con hash nel nome file (js/css generati dalla build): cache lunga
	location ~* \.(?:js|css)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Proxy verso il backend Node.js
	location /api/ {
		proxy_pass http://127.0.0.1:3000/api/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}
}
